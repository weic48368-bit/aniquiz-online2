<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10152d">
  <title>AniQuiz 2.0｜動漫猜謎</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div>
  <header class="topbar"><div class="brand"><span class="brand-mark">A</span><span>AniQuiz <b>2.0</b></span></div><span class="online"><i></i> 多人連線猜謎</span></header>
  <main>
    <section id="homeScreen" class="screen active">
      <div class="hero"><div class="eyebrow">ANIME KNOWLEDGE BATTLE</div><h1>動漫知識<br><span>大對決</span></h1><p>從經典神作到冷門佳作，看看誰才是真正的動漫通。</p></div>
      <div class="panel home-panel">
        <label for="nickname">你的暱稱</label><input id="nickname" maxlength="12" placeholder="輸入暱稱（最多 12 字）" autocomplete="off">
        <button id="createButton" class="primary">✦ 建立新房間</button>
        <div class="split"><span></span>或加入朋友<span></span></div>
        <div class="join-row"><input id="roomCodeInput" maxlength="5" placeholder="輸入 5 碼房號" autocomplete="off"><button id="joinButton" class="secondary">加入</button></div>
        <p id="homeMessage" class="message"></p>
      </div>
      <div class="feature-row"><div><b>100+</b><small>動漫題目</small></div><div><b>12</b><small>最多玩家</small></div><div><b>20 秒</b><small>每題限時</small></div></div>
    </section>

    <section id="lobbyScreen" class="screen">
      <div class="section-head"><div><div class="eyebrow">ROOM LOBBY</div><h2>等待玩家加入</h2></div><button id="leaveLobbyButton" class="ghost">離開房間</button></div>
      <div class="panel room-code-panel"><small>房間代碼</small><div class="room-code" id="roomCodeDisplay">-----</div><button id="copyCodeButton" class="copy-btn">複製房號</button></div>
      <div class="panel">
        <div class="panel-title"><h3>遊戲設定</h3><span id="hostLabel" class="tag">房主</span></div>
        <div class="settings-grid">
          <div><label for="categorySelect">題目範圍</label><select id="categorySelect"><option>全部動漫</option><option>熱血少年</option><option>戀愛與日常</option><option>奇幻與科幻</option><option>運動競技</option><option>冷門佳作</option></select></div>
          <div><label for="difficultySelect">難度</label><select id="difficultySelect"><option>全部</option><option>入門</option><option>普通</option><option>困難</option></select></div>
          <div><label for="questionCount">題數</label><select id="questionCount"><option value="5">5 題</option><option value="10" selected>10 題</option><option value="15">15 題</option><option value="20">20 題</option></select></div>
        </div>
        <p id="settingsHint" class="hint">只有房主可以調整設定。</p>
      </div>
      <div class="panel"><div class="panel-title"><h3>玩家列表</h3><span id="playerCount" class="count">0 / 12</span></div><div id="playerList" class="player-list"></div></div>
      <button id="startButton" class="primary">開始遊戲　→</button>
      <p id="lobbyMessage" class="message"></p>
    </section>

    <section id="gameScreen" class="screen">
      <div class="game-top"><div class="room-pill">房號 <b id="gameRoomCode">-----</b></div><div class="timer"><span id="timerValue">20</span><small>秒</small></div></div>
      <div class="progress-line"><div id="progressBar"></div></div>
      <div class="question-meta"><span id="questionNumber">QUESTION 01 / 10</span><span id="questionCategory">全部動漫</span></div>
      <div class="question-card"><div class="question-mark">?</div><h2 id="questionText">題目載入中…</h2></div>
      <div id="answerGrid" class="answer-grid">
        <button class="answer-option" data-answer="0"><span>A</span><b></b></button>
        <button class="answer-option" data-answer="1"><span>B</span><b></b></button>
        <button class="answer-option" data-answer="2"><span>C</span><b></b></button>
        <button class="answer-option" data-answer="3"><span>D</span><b></b></button>
      </div>
      <div id="answerFeedback" class="feedback">選擇你認為正確的答案</div>
      <div class="panel mini-score"><div class="panel-title"><h3>即時排行榜</h3><span class="hint">答對越快，分數越高</span></div><div id="gamePlayers" class="compact-players"></div></div>
    </section>

    <section id="finishScreen" class="screen">
      <div class="finish-hero"><div class="eyebrow">GAME COMPLETE</div><div class="trophy">🏆</div><h1>挑戰完成！</h1><p>本場動漫知識排行榜</p></div>
      <div class="panel"><div id="finalRanking" class="ranking"></div></div>
<button id="restartButton" class="primary">🔄 重新開始遊戲</button>
<button id="backHomeButton" class="primary">回到首頁</button>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="/socket.io/socket.io.js"></script><script src="/script.js"></script>
</body></html>
